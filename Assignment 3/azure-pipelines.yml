trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  PYTHON_VERSION: '3.11'

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(PYTHON_VERSION)'
    displayName: 'Use Python $(PYTHON_VERSION)'

  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      playwright install --with-deps chromium
    displayName: 'Install dependencies and Playwright browsers'

  - script: |
      python orchestrator.py
    displayName: 'Run multi-agent test framework'
    env:
      GROQ_API_KEY: $(GROQ_API_KEY)
      TARGET_URL: $(TARGET_URL)
      HEADLESS: 'true'
    continueOnError: true

  - script: |
      echo "Running pytest to generate JUnit XML if tests exist"
      mkdir -p data/reports || true
      pytest -q --junitxml=data/reports/results.xml || true
    displayName: 'Run pytest (produce JUnit XML)'
    continueOnError: true

  - task: PublishTestResults@2
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: 'data/reports/results.xml'
      failTaskOnFailedTests: true
    displayName: 'Publish test results'
    condition: always()

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: 'data'
      ArtifactName: 'test-artifacts'
    displayName: 'Publish locators, generated tests, and reports'
    condition: always()
